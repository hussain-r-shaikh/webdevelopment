{% extends "registration/base.html" %}

{% load crispy_forms_tags %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100 m-4">

        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-6">

            <div class="card shadow border-1 rounded-4">

                <div class="card-body p-4 p-md-5 border-1">

                    <div class="text-center mb-4">

                        <h2 class="navbar-brand">
                            Blog App
                        </h2>

                        <p class="text-muted">
                            Login to your account
                        </p>

                    </div>


                    <form method="post">

                        {% csrf_token %}

                        {{ form|crispy }}

                        <div class="d-grid mt-4">

                            <button type="submit" class="btn btn-success rounded-3">
                                Login
                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-4">
                        <small>
                        <span>No account. <a href="{% url 'blog:register' %}" class="text-decoration-none">
                            Signup
                        </a></span> /
                        <a href="{% url 'password_reset' %}" class="text-decoration-none">
                            Forgot password?
                        </a>
                        </small>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
