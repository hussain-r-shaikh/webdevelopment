{% extends "registration/base.html" %}

{% load crispy_forms_tags %}

{% block title %}
{{page_title}}
{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100 m-4">

        <div class="col-12 col-sm-10 col-md-12 col-lg-12 col-xl-12">

            <div class="card shadow border-1 rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="navbar-brand">
                            Blog App
                        </h2>
                        <p class="text-muted">
                            Register to BlogApp
                        </p>
                    </div>


                    <form method="post">

                        {% csrf_token %}

                        {% crispy form %}

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
