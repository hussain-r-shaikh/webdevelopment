{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm border-0 form-card">
    <div class="card-body p-4">
        {% load crispy_forms_tags %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% crispy form %}
        </form>

    </div>
</div>
{% endblock %}
