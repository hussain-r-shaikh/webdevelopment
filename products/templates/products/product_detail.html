{% extends "dashboard/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ product.title }}</h1>
  <div>
    <a href="{% url 'products:product_update' product.pk %}" class="btn btn-primary">
      <i class="bi bi-pencil"></i> Edit
    </a>
    <a href="{% url 'products:product_delete' product.pk %}" class="btn btn-outline-danger">
      <i class="bi bi-trash"></i> Delete
    </a>
    <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary">Back</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="row">
      {% if product.image %}
      <div class="col-md-4 mb-3">
        <img src="{{ product.image.url }}" alt="{{ product.title }}" class="img-fluid rounded">
      </div>
      {% endif %}
      <div class="{% if product.image %}col-md-8{% else %}col-12{% endif %}">
        <dl class="row mb-0">
          <dt class="col-sm-3">Price</dt>
          <dd class="col-sm-9">{{ product.price }}</dd>

          <dt class="col-sm-3">Description</dt>
          <dd class="col-sm-9">{{ product.description|linebreaksbr|default:"—" }}</dd>

          <dt class="col-sm-3">Created</dt>
          <dd class="col-sm-9">{{ product.created_at }}</dd>

          <dt class="col-sm-3">Updated</dt>
          <dd class="col-sm-9">{{ product.updated_at }}</dd>
        </dl>
      </div>
    </div>
  </div>
</div>
{% endblock %}
