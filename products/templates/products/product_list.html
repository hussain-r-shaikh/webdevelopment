{% extends "dashboard/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Products</h1>
  <a href="{% url 'products:product_create' %}" class="btn btn-primary">
    <i class="bi bi-plus-lg"></i> Add Product
  </a>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover table-striped mb-0">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Price</th>
          <th>Created</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for product in products %}
        <tr>
          <td>{{ product.pk }}</td>
          <td>
            <a href="{% url 'products:product_detail' product.pk %}">
              {{ product.title }}
            </a>
          </td>
          <td>{{ product.price }}</td>
          <td>{{ product.created_at|date:"Y-m-d" }}</td>
          <td class="text-end text-nowrap">
            <a href="{% url 'products:product_detail' product.pk %}" class="btn btn-sm btn-outline-secondary" title="View">
              <i class="bi bi-eye"></i>
            </a>
            <a href="{% url 'products:product_update' product.pk %}" class="btn btn-sm btn-outline-primary" title="Edit">
              <i class="bi bi-pencil"></i>
            </a>
            <a href="{% url 'products:product_delete' product.pk %}" class="btn btn-sm btn-outline-danger" title="Delete">
              <i class="bi bi-trash"></i>
            </a>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="5" class="text-center text-muted py-4">No products yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
